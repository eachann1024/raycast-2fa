name: Daily Stable Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified build as a stable GitHub Release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-stable-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for publishable changes
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            python3 .github/scripts/stable-release.py prepare --force-build
          else
            python3 .github/scripts/stable-release.py prepare
          fi
      - uses: actions/setup-node@v4
        if: steps.prepare.outputs.build == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        if: steps.prepare.outputs.build == 'true'
        run: npm ci --no-audit --no-fund
      - name: Compile the Raycast extension
        if: steps.prepare.outputs.build == 'true'
        run: ./node_modules/.bin/ray build -e dist --output dist-release --non-interactive --exit-on-error
      - name: Package source and compiled extension
        if: steps.prepare.outputs.build == 'true'
        run: python3 .github/scripts/stable-release.py package
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.build == 'true'
        with:
          name: stable-${{ github.sha }}
          path: .stable-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.build == 'true' && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: stable-${{ github.sha }}
          path: .stable-release/
      - name: Verify assets and publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_ALLOWED: 'true'
        run: python3 .github/scripts/stable-release.py publish
